# The generated whole-request engine is a multi-megabyte Java compilation unit. Titan lowers it
# in-process, so Gradle's 512 MiB default enters GC thrashing before the bounded one-minute
# transpilation completes. Keep enough headroom for javac/TIR while retaining a finite build cap.
org.gradle.jvmargs=-Xms256m -Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
