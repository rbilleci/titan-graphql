name: Bug report
description: Report a reproducible defect in Titan GraphQL.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not disclose vulnerabilities, credentials, customer data, or private deployment details here.
        Follow SECURITY.md for security reports.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest command, input, and expected versus actual result.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit or release identifier.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: JDK version, operating system, Docker version if applicable, and database dialect.
    validations:
      required: true
