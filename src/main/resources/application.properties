# Execution mode for the application /graphql endpoint (completion plan W5.1):
#   java - the in-JVM kernel (default)
#   sql  - the DEPLOYED Titan stored functions over the Quarkus datasource below
# Override per run with -Dtitan.graphql.execution.mode=sql or TITAN_GRAPHQL_EXECUTION_MODE=sql.
titan.graphql.execution.mode=java

# Caller-supplied X-Titan-* request-context headers can influence authorization and visibility.
# They are ignored by default. Enable only when an authenticated gateway strips client copies and
# injects these headers itself.
titan.graphql.http.trust-request-context-headers=false

# The management plane is disabled by default: without this server-side token it answers 404.
# Supply TITAN_GRAPHQL_ADMIN_ACCESS_TOKEN through a secret manager, never this file or source
# control. The effective actor identity and role also come from server configuration.
titan.graphql.admin.access-token=
titan.graphql.admin.role=operator
titan.graphql.admin.actor-key=titan-admin

# The serving datasource for sql mode. Deliberately unconfigured by default:
# java mode never opens it, and sql mode without a URL fails with a descriptive
# 503 GraphQL error (never a silent fallback to java mode). Point it at a
# PostgreSQL carrying ddl/titan_graphql_postgres.sql plus the packaged Titan
# migrations (R__titan_010_runtime.sql, R__titan_020_routines.sql), e.g.:
#   quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/titan_graphql
#   quarkus.datasource.username=postgres
#   quarkus.datasource.password=titan
quarkus.datasource.db-kind=postgresql

# No Dev Services: plain `test` and `quarkusDev` must stay Docker-free; the SQL-mode
# integration test provisions and deploys its own container explicitly.
quarkus.datasource.devservices.enabled=false

# Management store for the /admin/graphql mutation plane (dogfood campaign Phase C):
#   file - file-backed / in-memory (default — keeps plain `test` and dev Docker-free)
#   jdbc - the durable dogfooded core JDBC store (JdbcTransactionalMutationStore over
#          Titan-transpiled routines), persisting over the Quarkus datasource above.
# In jdbc mode the management schema + routines are bootstrapped at startup via
# ManagementSchemaInstaller; a missing/unreachable datasource fails fast and descriptively
# (never a silent fallback to file). Override per run with
# -Dtitan.graphql.management.store=jdbc or TITAN_GRAPHQL_MANAGEMENT_STORE=jdbc.
titan.graphql.management.store=file
