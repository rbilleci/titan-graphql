apiVersion: titan.graphql/v1alpha1
kind: ProjectionModel
metadata:
  name: commerce
  version: 1
  owner: test
  description: Unrelated schema proving metadata-driven JDBC execution.

database:
  catalog: commerce
  defaultSchema: commerce
  tables:
    customers:
      physicalName: customers
      schema: commerce
      primaryKey: id
    orders:
      physicalName: orders
      schema: commerce
      primaryKey: id
    countries:
      physicalName: countries
      schema: commerce
      primaryKey: code
    api_clients:
      physicalName: api_clients
      schema: commerce
      primaryKey: id
    inventory_items:
      physicalName: inventory_items
      schema: commerce
      primaryKey: warehouse_code

contextFilters:
  activeCustomers:
    description: Example fail-closed row predicate supplied by trusted request context.
    type: booleanEquals
    column: active
    contextKey: activeCustomers
    valueType: Boolean
    failClosed: true
    phase: beforeClientFilters

types:
  Customer:
    table: customers
    schema: commerce
    physicalTable: customers
    primaryKey: id
    fields:
      id:
        column: id
        type: Int
        nullable: false
      name:
        column: name
        type: String
        nullable: false
      active:
        column: active
        type: Boolean
        nullable: false
    relations:
      orders:
        target: Order
        cardinality: many
        nullable: false
        localColumn: id
        targetColumn: customer_id
        capabilities:
          selectable: true
          batchable: true
          selectionHopBudget: 2
      orderConnection:
        target: Order
        cardinality: many
        nullable: false
        localColumn: id
        targetColumn: customer_id
        capabilities:
          selectable: true
          batchable: true
          pagination: relay
          totalCount: exact
          selectionHopBudget: 2
          filterHopBudget: 0
          sortHopBudget: 0
          defaultPageSize: 10
          maxPageSize: 100
        arguments:
          orderId:
            type: Int
            kind: equals
            column: id
            path: id
          first:
            kind: relayFirst
          after:
            kind: relayAfter
          last:
            kind: relayLast
          before:
            kind: relayBefore
        sortPaths:
          id:
            column: id
            path: id
            direction: asc
            tieBreaker: id

  Order:
    table: orders
    schema: commerce
    physicalTable: orders
    primaryKey: id
    fields:
      id:
        column: id
        type: Int
        nullable: false
      reference:
        column: reference
        type: String
        nullable: false
    relations:
      customer:
        target: Customer
        cardinality: one
        nullable: false
        localColumn: customer_id
        targetColumn: id
        capabilities:
          selectable: true
          batchable: true
          selectionHopBudget: 2

  Country:
    table: countries
    schema: commerce
    physicalTable: countries
    primaryKey: code
    fields:
      code:
        column: code
        type: String
        nullable: false
      name:
        column: name
        type: String
        nullable: false

  ApiClient:
    table: api_clients
    schema: commerce
    physicalTable: api_clients
    primaryKey: id
    fields:
      id:
        column: id
        type: UUID
        nullable: false
      label:
        column: label
        type: String
        nullable: false

  InventoryItem:
    table: inventory_items
    schema: commerce
    physicalTable: inventory_items
    primaryKey: warehouse_code
    fields:
      warehouse:
        column: warehouse_code
        type: String
        nullable: false
      sku:
        column: sku
        type: String
        nullable: false
      quantity:
        column: quantity
        type: Int
        nullable: false

roots:
  customer:
    type: Customer
    operation: point
    argument:
      name: id
      type: Int
      kind: equals
      column: id
      path: id

  country:
    type: Country
    operation: point
    argument:
      name: code
      type: String
      kind: equals
      column: code
      path: code

  apiClient:
    type: ApiClient
    operation: point
    argument:
      name: id
      type: UUID
      kind: equals
      column: id
      path: id

  inventoryItem:
    type: InventoryItem
    operation: point
    arguments:
      warehouse:
        type: String
        kind: equals
        column: warehouse_code
        path: warehouse
      sku:
        type: String
        kind: equals
        column: sku
        path: sku

  customers:
    type: Customer
    operation: connection
    pagination:
      mode: relay
      defaultPageSize: 10
      maxPageSize: 100
      totalCount: exact
      cursor:
        path: id
        column: id
        direction: asc
        tieBreaker: id
    contextFilters:
      - activeCustomers
    sortPaths:
      name:
        column: name
        path: name
        direction: asc
        nulls: last
        tieBreaker: id

  orders:
    type: Order
    operation: connection
    pagination:
      mode: relay
      defaultPageSize: 10
      maxPageSize: 100
      totalCount: exact
      cursor:
        path: id
        column: id
        direction: asc
        tieBreaker: id
    sortPaths:
      customerName:
        column: customer_id
        path: customer.name
        hops: 1
        direction: asc
        nulls: last
        tieBreaker: id
