# Test-only transport configuration. Production defaults deliberately distrust caller context
# headers and disable /admin/graphql until a server-side bearer token is supplied.
titan.graphql.http.trust-request-context-headers=true
titan.graphql.admin.access-token=test-admin-token
titan.graphql.admin.role=operator
titan.graphql.admin.actor-key=test-admin
# Transport smoke tests intentionally exercise the small in-JVM reference fixture. Compiled-mode
# tests construct an explicit engine around an installed, model-bound package.
titan.graphql.execution.mode=java
titan.graphql.allow-legacy-execution-modes=true
